name: Bootstrap wrapper and drawables (one-off)

on:
  push:
    branches: [ "feature/recent-recall-app" ]
    paths: [ ".github/workflows/bootstrap.yml" ]

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - name: Generate wrapper if missing
        run: |
          if [ ! -f gradlew ]; then gradle --no-daemon wrapper --gradle-version 8.7; fi
          chmod +x gradlew
          ls -la gradlew gradlew.bat gradle/wrapper
      - name: Copy PNG runtime copies if missing
        run: |
          mkdir -p app/src/main/res/drawable
          for f in res/drawable/*.png; do
            b=$(basename "$f" | tr 'A-Z' 'a-z')
            [ -f "app/src/main/res/drawable/$b" ] || cp "$f" "app/src/main/res/drawable/$b"
          done
          ls -la app/src/main/res/drawable
      - name: Commit generated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gradlew gradlew.bat gradle/wrapper app/src/main/res/drawable
          git update-index --chmod=+x gradlew
          git diff --cached --quiet || git commit -m "Add Gradle 8.7 wrapper and runtime PNG copies (generated by CI)"
          git push
